name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout lfs
        run: |
          git lfs pull
      - name: Install the dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Download and Index GeoPandas Wheels
        run: |
          mkdir -p pypi
          # Try to download geopandas wheels; allow failure because manylinux wheels
          # are not Pyodide-compatible (Pyodide requires WASM/pyodide-built wheels).
          pip download --only-binary=:all: --dest pypi geopandas || true
          if [ -n "$(ls -A pypi 2>/dev/null)" ]; then
            jupyter lite pip index pypi
          else
            echo "No geopandas wheels found (likely not Pyodide-compatible). Skipping pip index."
            echo "To run geopandas in a JupyterLite Pyodide kernel you'll need Pyodide-built wheels or a server-side kernel."
          fi
      - name: Build the JupyterLite site
        run: |
          cp README.md content
          jupyter lite build --contents content --output-dir dist
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
